# ruoyi-vue-pro 管理后台 Nginx 站点样例
# 用法（Linux）:
#   sudo cp script/nginx/yudao-admin.conf /etc/nginx/conf.d/yudao-admin.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 请按实际修改 server_name；前端静态目录与 Jenkins UI_DEPLOY_DIR 保持一致。

server {
    listen 80;
    server_name _;

    root /work/projects/yudao-ui-admin;
    index index.html;

    # 前端 History 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（与前端 VITE_API_URL=/admin-api 一致）
    location /admin-api/ {
        proxy_pass http://127.0.0.1:48080/admin-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket（yudao.websocket.path=/infra/ws）
    location /infra/ws {
        proxy_pass http://127.0.0.1:48080/infra/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # 静态资源缓存（可选）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
