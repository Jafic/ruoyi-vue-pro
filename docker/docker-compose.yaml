version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: mysql8
    restart: always
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST:-%}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    networks:
      - ruoyi-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456} --appendonly yes
    networks:
      - ruoyi-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  ruoyi-network:
    driver: bridge

